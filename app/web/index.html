<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Try a guided offline warranty closeout. Match the unit, catch a missing signature, and verify the handoff.">
  <title>Offline Warranty Closeout</title>
  <link rel="icon" href="./app/web/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./app/web/styles.css">
</head>
<body data-mode="local">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <img src="./app/web/icon.svg" width="36" height="36" alt="">
        <span>Warranty Closeout</span>
      </div>
      <div id="connection" class="topbar-tools"></div>
    </div>
  </header>
  <main class="workspace">
    <section id="welcome" class="welcome" aria-labelledby="welcome-heading" hidden></section>
    <div id="visit">
      <div id="visit-header"></div>
      <section id="guide" class="guide" aria-labelledby="guide-heading" hidden></section>
      <div class="layout" id="visit-layout">
        <section class="card conversation" id="conversation" aria-labelledby="conversation-heading">
          <div class="card-head">
            <div class="card-title">
              <span class="tile" id="conversation-icon" aria-hidden="true"></span>
              <div><h2 id="conversation-heading">Service notes</h2><p id="runtime-label">Loading workspace…</p></div>
            </div>
            <div id="cache-state"></div>
          </div>
          <div id="thread" class="thread" role="log" aria-live="polite" aria-label="Conversation" tabindex="0"></div>
          <div id="unit-options"></div>
          <div id="composer-area" class="composer-area" hidden>
            <div id="suggestions" class="suggestions"></div>
            <form id="composer" class="composer">
              <label for="note" class="sr-only">Service note</label>
              <textarea id="note" name="note" rows="2" maxlength="1500" placeholder="Describe what happened at the machine…"></textarea>
              <div class="composer-actions">
                <button type="button" id="mic" class="button button-quiet" title="Record and transcribe a service note" hidden></button>
                <button type="submit" id="send" class="button button-primary">Send</button>
              </div>
            </form>
            <p id="composer-hint" class="composer-hint">Service notes stay on this device.</p>
          </div>
        </section>
        <aside id="closeout" class="card closeout" aria-labelledby="closeout-heading"></aside>
      </div>
    </div>
    <div id="footer" class="footer"></div>
  </main>
  <div id="coach" class="coach" hidden aria-hidden="true">
    <div class="coach-block"></div><div class="coach-block"></div><div class="coach-block"></div><div class="coach-block"></div>
    <div class="coach-hole"></div>
  </div>
  <div id="notice" class="notice" role="status" hidden></div>
  <dialog id="dialog" aria-labelledby="dialog-title">
    <div id="dialog-inner"></div>
  </dialog>
  <noscript><p class="noscript">Enable JavaScript to use the closeout workspace.</p></noscript>
  <script type="module" src="./app/web/app.mjs"></script>
</body>
</html>
